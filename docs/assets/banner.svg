    <path d="M892-55 1139 88V374L892 517 645 374V88Z" stroke="#76DEC3" stroke-opacity=".08"/>
    <path d="m1019-47 247 143v286l-247 143-247-143V96Z" stroke="#76DEC3" stroke-opacity=".08"/>
    <path d="M0 1H1280" stroke="#76DEC3" stroke-opacity=".5" stroke-width="2"/>

