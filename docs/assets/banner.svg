<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Cemu BOTW Precache — Prepare first. Play next.</title>
  <desc id="description">A dark teal banner with gold and mint circuit paths connecting recorded shaders to pipeline preparation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B2026"/><stop offset="1" stop-color="#071318"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(990 190) rotate(90) scale(310 380)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24796B" stop-opacity=".3"/><stop offset="1" stop-color="#24796B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trace" x1="720" y1="260" x2="1170" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76DEC3"/><stop offset="1" stop-color="#E3C484"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#6DBCA9" stroke-opacity=".06"/>
    </pattern>
    <clipPath id="bounds"><rect width="1280" height="440" rx="22"/></clipPath>
  </defs>
